apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # trace → 같은 traceId 의 로그
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 로그 → trace (OTLP 로그의 structured metadata trace_id)
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'

  # iandbook — 운영 AWS(ap-northeast-2)의 CloudWatch 지표 · Logs Insights 와 X-Ray trace.
  # 키는 읽기 전용 IAM 사용자 grafana-camus-readonly 의 것이다(.env).
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    jsonData:
      authType: keys
      defaultRegion: ap-northeast-2
      tracingDatasourceUid: xray
    secureJsonData:
      accessKey: $GRAFANA_AWS_ACCESS_KEY_ID
      secretKey: $GRAFANA_AWS_SECRET_ACCESS_KEY

  - name: X-Ray
    uid: xray
    type: grafana-x-ray-datasource
    jsonData:
      authType: keys
      defaultRegion: ap-northeast-2
    secureJsonData:
      accessKey: $GRAFANA_AWS_ACCESS_KEY_ID
      secretKey: $GRAFANA_AWS_SECRET_ACCESS_KEY
