plugins {
    id 'groovy'
    id 'project.camus.library-webflux-conventions'
    id 'project.camus.tracing-conventions'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
    id "com.github.imflog.kafka-schema-registry-gradle-plugin" version "1.12.0"
}

dependencies {
    implementation project(':common')
    implementation project(':common:common-webflux')
    implementation project(':kafka:kafka-event')
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'io.confluent:kafka-avro-serializer:8.1.6'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

schemaRegistry {
    url = 'http://localhost:8081'
    quiet = true
    download {
        subject('task-value', "${projectDir}/src/main/avro", 'Task')
    }
}

test {
    useJUnitPlatform()
}
