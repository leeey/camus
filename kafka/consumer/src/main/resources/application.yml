server:
  port: 9091
spring:
  application:
    name: camus-kafka-consumer
  datasource:
    url: ${TASK_VIEW_DB_URL:jdbc:postgresql://localhost:15432/camus_task_view}
    username: ${TASK_VIEW_DB_USERNAME:camus}
    password: ${TASK_VIEW_DB_PASSWORD:camus}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
kafka:
  bootstrap-servers: ${spring.kafka.bootstrap-servers}
  schema-registry-url: ${spring.kafka.properties.schema.registry.url}
camus:
  kafka:
    task-events:
      topic: task-events
      group-id: camus-task-view
      dlt-partitions: 3
      dlt-replicas: 3
      retry:
        max-retries: 3
        initial-interval: 1s
        multiplier: 2.0
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        # 로컬에서 collector 없이 실행할 때 export 오류 로그가 쌓이지 않도록 기본은 끈다.
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # 지표는 /actuator/prometheus 로 수집한다.
        enabled: false
