plugins {
    id 'groovy'
    id 'project.camus.library-webmvc-conventions'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
    id "com.github.imflog.kafka-schema-registry-gradle-plugin" version "1.12.0"
}

dependencies {
    implementation project(':common')
    implementation project(':common:common-webmvc')
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'io.confluent:kafka-avro-serializer:8.1.6'
}

schemaRegistry {
    url = 'http://localhost:8081'
    quiet = true
    download {
        subject('task-value', "${projectDir}/src/main/avro", 'Task')
    }
}

test {
    useJUnitPlatform()
}
