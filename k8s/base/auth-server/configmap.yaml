apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-server
  labels:
    app.kubernetes.io/name: auth-server
data:
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
  TRACING_SAMPLING_PROBABILITY: "0.1"
  AUTH_ISSUER_URI: "http://auth.localtest.me:8080"
  AUTH_DB_URL: "jdbc:postgresql://postgres:5432/camus_auth"
  AUTH_DB_USERNAME: "camus"
  AUTH_WEB_REDIRECT_URIS: "http://app.localtest.me:8080/login/oauth2/code/camus-web"
