apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    app.kubernetes.io/name: auth-server
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      # graceful shutdown(spring 기본 30s) + preStop 대기보다 길게
      terminationGracePeriodSeconds: 45
      # service 이름으로 들어오는 환경변수(REDIS_PORT=tcp://... 등)가 애플리케이션 설정과 겹치지 않게 한다.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-server
          image: camus/auth-server
          ports:
            - name: http
              containerPort: 9400
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: auth-server
          env:
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camus-secrets
                  key: AUTH_DB_PASSWORD
            - name: AUTH_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: camus-secrets
                  key: AUTH_SERVICE_CLIENT_SECRET
            - name: AUTH_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: camus-secrets
                  key: AUTH_WEB_CLIENT_SECRET
            - name: AUTH_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: camus-secrets
                  key: AUTH_SIGNING_PRIVATE_KEY
                  # 없으면 auth-server 가 임시 키를 만든다 (로컬 전용)
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # cpu limit 은 두지 않는다 (throttling). 힙은 메모리 한도의 75%.
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # 종료 전에 endpoint 에서 빠질 시간을 둔다 (그 사이 들어온 요청은 처리한다)
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { }
