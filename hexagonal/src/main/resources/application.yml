server:
  port: 8084
  error:
    include-stacktrace: never
spring:
  application:
    name: hexagonal
  datasource:
    url: ${TASK_DB_URL:jdbc:postgresql://localhost:15432/camus}
    username: ${TASK_DB_USERNAME:camus}
    password: ${TASK_DB_PASSWORD:camus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    template:
      # producer span 을 만들고 traceparent 헤더를 붙인다.
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
camus:
  outbox:
    relay:
      enabled: true
      fixed-delay: 1s
      batch-size: 100
      send-timeout: 10s
  kafka:
    topics:
      task-events:
        name: task-events
        partitions: 3
        replicas: 3
        min-insync-replicas: 2
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8761/eureka}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        # 로컬에서 collector 없이 실행할 때 export 오류 로그가 쌓이지 않도록 기본은 끈다.
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # 지표는 /actuator/prometheus 로 수집한다.
        enabled: false
