services:
  postgres:
    image: postgres:18-alpine
    container_name: camus-postgres
    environment:
      POSTGRES_DB: camus
      POSTGRES_USER: camus
      POSTGRES_PASSWORD: camus
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U camus -d camus" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - camus-postgres:/var/lib/postgresql

volumes:
  camus-postgres:
