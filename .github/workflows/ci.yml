name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # testcontainers 통합 테스트(redis, kafka)는 runner 의 docker 를 사용
      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
