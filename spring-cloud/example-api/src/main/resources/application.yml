server:
  port: 0 # random port for gateway's load balancer
spring:
  application:
    name: example-api
eureka:
  instance:
    instance-id: ${spring.cloud.client.hostname}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        # 로컬에서 collector 없이 실행할 때 export 오류 로그가 쌓이지 않도록 기본은 끈다.
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        # 지표는 /actuator/prometheus 로 수집한다.
        enabled: false
  logging:
    export:
      otlp:
        # true 면 로그를 OTLP 로도 보낸다 (traceId/spanId 포함).
        enabled: ${OTEL_LOGS_EXPORT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health, prometheus
