server:
  port: 8000
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          default-filters:
            - name: GlobalFilter
              args:
                filterName: GlobalFilter
            - StripPrefix=1
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: '*'
                allowedMethods:
                  - OPTIONS
                  - POST
                  - GET
                  - PUT
                  - DELETE
                allowedHeaders:
                  - Content-Type
                  - Authorization
                  - Access-Control-Allow-Origin
                  - Access-Control-Allow-Headers
                  - Access-Control-Allow-Methods
                  - Access-Control-Allow-Credentials
                  - Trace-Id
          routes:
            # task 서비스 (hexagonal): /task-service/v1/tasks/** -> /v1/tasks/**
            - id: task-service
              uri: ${TASK_SERVICE_URI:lb://HEXAGONAL}
              predicates:
                - Path=/task-service/**
              filters:
                # 순서: rate limit → circuit breaker → retry
                # rate limit 을 default-filters 에 두면 retry 보다 뒤에 실행되어 gateway 의 재시도까지 클라이언트 토큰을 쓰므로, 라우트의 첫 필터로 둔다.
                # 클라이언트 IP 별 토큰 버킷 (redis). 초과하면 429
                - &rate-limiter
                  name: RequestRateLimiter
                  args:
                    key-resolver: '#{@clientIpKeyResolver}'
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1
                # circuit breaker 는 재시도까지 실패한 요청을 1건으로 기록한다. 재시도는 GET 만.
                - name: CircuitBreaker
                  args:
                    name: task-service
                    fallbackUri: forward:/fallback/task-service
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                    exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
            - id: example-api
              uri: lb://EXAMPLE-API
              predicates:
                - Path=/example-api/**
              filters:
                - *rate-limiter
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-server 가 서명한 토큰만 받는다. 공개키(JWKS)로 서명을, issuer 로 발급자를 검증한다.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9400}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9400/oauth2/jwks}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        # 기본값 1s 는 httpclient response-timeout(5s) 보다 짧아 정상 요청도 끊으므로 맞춘다.
        timeout-duration: 6s
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        # 로컬에서 collector 없이 실행할 때 export 오류 로그가 쌓이지 않도록 기본은 끈다.
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        # 지표는 /actuator/prometheus 로 수집한다.
        enabled: false
  logging:
    export:
      otlp:
        # true 면 로그를 OTLP 로도 보낸다 (traceId/spanId 포함).
        enabled: ${OTEL_LOGS_EXPORT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health, prometheus
