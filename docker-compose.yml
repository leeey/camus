# 참조 흐름(gateway → task 서비스 → outbox → kafka → consumer) 로컬 인프라
# - postgresql: camus(task 서비스), camus_task_view(consumer)
# - kafka: broker 3 + schema registry + rest proxy
# - redis: gateway rate limit
# - 관측 스택(otel collector, tempo, loki, prometheus, grafana)은 `--profile observability` 로 띄운다
include:
  - kafka/docker-compose.yml
  - docker/observability/docker-compose.yml

services:
  postgres:
    image: postgres:18-alpine
    container_name: camus-postgres
    environment:
      POSTGRES_DB: camus
      POSTGRES_USER: camus
      POSTGRES_PASSWORD: camus
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U camus -d camus" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - camus-postgres:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    container_name: camus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  camus-postgres:
