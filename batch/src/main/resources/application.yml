server:
  port: 8999
spring:
  batch:
    job:
      enabled: true
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:db;MODE=MYSQL;
    username: sa
    password:
  application:
    name: database-jpa
  devtools:
    add-properties: false
camus:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    kms:
      key-id: ${AWS_KMS_KEY_ID:f096a65c-38d6-4a2b-b0c5-7f5c81636367}
